[workspace]
members = [
    "crates/octoscript-core",
    "crates/octoscript-ui-l0",
    "crates/octoscript-linux-seccomp",
    "crates/octoscript-linux-project-quota",
    "crates/octoscript-capabilities",
    "crates/octoscript-protocol",
    "crates/octoscript-schema",
    "crates/octoscript-sandbox",
    "crates/octoscript-storage",
    "crates/octoscript-worker",
    "crates/octoscript-workflow",
    "crates/octoscript-cli",
    "crates/octoscript-lsp",
    "crates/octoscript-media-host",
]
default-members = [
    "crates/octoscript-core",
    "crates/octoscript-linux-seccomp",
    "crates/octoscript-linux-project-quota",
    "crates/octoscript-capabilities",
    "crates/octoscript-protocol",
    "crates/octoscript-schema",
    "crates/octoscript-sandbox",
    "crates/octoscript-storage",
    "crates/octoscript-worker",
    "crates/octoscript-workflow",
    "crates/octoscript-cli",
    "crates/octoscript-lsp",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/OctoSense-org/Octoscript"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# makepad's own workspace carries this and we build the same crate, so without
# it `cargo test -p makepad-script` differs from upstream's. makepad-stitch is a
# WebAssembly interpreter; unoptimised its frames are large enough that one
# chunk of a batched math expression (5461 points for a vec3) overflows a test
# thread's stack, and math_aot's batch test aborts. Raising the stack does not
# help, because the depth follows the point count.
[profile.test.package.makepad-stitch]
opt-level = 1
