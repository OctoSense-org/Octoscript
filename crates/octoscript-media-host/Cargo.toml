[package]
name = "octoscript-media-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Example host: agent-authored Octoscript workflow orchestrating policy-bound media capabilities (image.generate, media.transcode)"

[lints]
workspace = true

[[bin]]
name = "octoscript-media-host"
path = "src/main.rs"

[dependencies]
octoscript-capabilities = { path = "../octoscript-capabilities", features = ["http-endpoint-catalog"] }
octoscript-core = { path = "../octoscript-core" }
octoscript-workflow = { version = "0.1.0", path = "../octoscript-workflow", features = ["http-endpoint-catalog"] }
serde_json = "1.0.150"
